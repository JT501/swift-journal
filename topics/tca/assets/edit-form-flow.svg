<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">Unidirectional data flow in EditForm</title>
  <desc id="desc">The child view sends a binding action to the parent reducer tree. EditForm updates form.title, and the scoped store exposes the updated state to the child view.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M320 76v56"/>
    <path d="M320 190v62"/>
    <path d="M160 278H60V50h100"/>
  </g>
  <g stroke="#94a3b8">
    <rect x="160" y="24" width="320" height="52" rx="8" fill="#fff"/>
    <rect x="160" y="134" width="320" height="56" rx="8" fill="#eff6ff"/>
    <rect x="160" y="254" width="320" height="48" rx="8" fill="#ecfdf5"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle">
    <text x="320" y="56" font-weight="700">EditFormView · Title field</text>
    <text x="320" y="157" font-weight="700">FormScreen reducer tree</text>
    <text x="320" y="178">Scope routes the action to EditForm</text>
    <text x="320" y="284" font-weight="700">Parent state · form.title = “Notes”</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14">
    <text x="333" y="109" fill="#1e40af">Binding action via scoped store</text>
    <text x="333" y="225" fill="#065f46">BindingReducer updates title</text>
    <text x="73" y="147" fill="#065f46">Scoped store<tspan x="73" dy="19">exposes the</tspan><tspan x="73" dy="19">updated state</tspan></text>
  </g>
</svg>
